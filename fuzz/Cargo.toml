[package]
name = "abps-verification-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
[package.metadata]
cargo-fuzz = true
[workspace]
[features]
default = ["berry-spike", "mosaic-spike", "local-branches-spike", "bytes-interop"]
berry-spike = ["abps-reference/berry-spike"]
mosaic-spike = ["abps-reference/mosaic-spike"]
local-branches-spike = ["mosaic-spike", "abps-reference/local-branches-spike"]
bytes-interop = ["berry-spike", "abps-reference/bytes-interop"]
[dependencies]
libfuzzer-sys = "=0.4.12"
abps-reference = { path = ".." }
serde_json = "1.0"
[[bin]]
name = "adversarial_rights"
path = "fuzz_targets/adversarial_rights.rs"
test = false
doc = false
bench = false
[[bin]]
name = "ownership_trace"
path = "fuzz_targets/ownership_trace.rs"
test = false
doc = false
bench = false
[[bin]]
name = "mosaic_boundaries"
path = "fuzz_targets/mosaic_boundaries.rs"
test = false
doc = false
bench = false
[[bin]]
name = "local_branches"
path = "fuzz_targets/local_branches.rs"
test = false
doc = false
bench = false
[[bin]]
name = "configuration"
path = "fuzz_targets/configuration.rs"
test = false
doc = false
bench = false
